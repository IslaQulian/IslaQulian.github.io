<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>曲的個人頁</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
/* ---------- ColorHunt 色系 ---------- */
:root{
    --black: #0C0C0C;
    --white: #F5F5F5;
    --wine: #8B0A1A; 
    --wine-light: #B21828;
}

/* ---------- 全域 ---------- */
body{
    margin:0;
    background: var(--black);
    color: var(--white);
    font-family: "Microsoft JhengHei", sans-serif;
    overflow-x: hidden;
}

/* ---------- 開場動畫 ---------- */
#intro{
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: var(--black);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
    animation: introOut 2s ease 2.5s forwards;
}

#intro h1{
    font-size: 3rem;
    opacity:0;
    animation: fadeIn 1.8s forwards;
}

.snake-line{
    width:0;
    height:3px;
    background: var(--wine);
    margin-top:20px;
    animation: snakeDraw 2s ease forwards 0.8s;
}

@keyframes fadeIn{
    to{opacity:1;}
}

@keyframes snakeDraw{
    from{width:0;}
    to{width:200px;}
}

@keyframes introOut{
    to{opacity:0; visibility:hidden;}
}

/* ---------- 頭像區 ---------- */
.header{
    padding:80px 20px;
    text-align:center;
}

.avatar{
    width:160px;
    height:160px;
    border-radius:50%;
    border:4px solid var(--wine);
    background-size:cover;
    background-position:center;
    margin:auto;
    box-shadow:0 0 20px var(--wine);
}

.name{
    margin-top:20px;
    font-size:2rem;
}

/* ---------- 關於我區 ---------- */
.about{
    width:90%;
    max-width:700px;
    margin:80px auto;
    background:#111;
    padding:40px;
    border-left:6px solid var(--wine);
    box-shadow:0 0 20px rgba(139,10,26,0.5);
    line-height:2;
    border-radius:12px;
}

/* ---------- 作品集區 ---------- */
.portfolio{
    padding:80px 20px;
    text-align:center;
}

.portfolio h2{
    font-size:2rem;
    margin-bottom:40px;
}

.p-items{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
}

.p-item{
    width:240px;
    height:160px;
    background:#222;
    border-radius:12px;
    box-shadow:0 0 15px rgba(255,255,255,0.05);
    transition:0.3s;
    position:relative;
    overflow:hidden;
}

.p-item:hover{
    transform: translateY(-8px);
    box-shadow:0 0 20px var(--wine-light);
}

.p-item span{
    position:absolute;
    bottom:10px; left:15px;
    font-size:1.1rem;
}

/* jQuery hover 光暈 */
.p-item-hover{
    box-shadow:0 0 25px var(--wine-light) !important;
}

/* ---------- 聯絡方式 ---------- */
.contact{
    text-align:center;
    margin:80px 0;
}

.contact a{
    color: var(--wine-light);
    text-decoration:none;
    font-size:1.3rem;
    border-bottom:2px solid transparent;
    transition:0.3s;
}

.contact a:hover{
    border-bottom:2px solid var(--wine-light);
}

/* ---------- 頁尾 ---------- */
footer{
    text-align:center;
    padding:30px;
    opacity:0.6;
}
</style>

</head>
<body>

<!-- 開場動畫 -->
<div id="intro">
    <h1>Welcome</h1>
    <div class="snake-line"></div>
</div>

<!-- 頭像區 -->
<div class="header">
    <div class="avatar" style="background-image:url('Q.jpg');"></div>
    <div class="name">曲 (⁠ㆁ⁠ω⁠ㆁ⁠)</div>
</div>

<!-- 關於我 -->
<div class="about">
    <h2>關於我</h2>
    <p>畫畫圖、打打程式、養養蛇、養養貓、戳戳人，<br>
    這個破世界毀滅吧 (≧∇≦)</p>
</div>

<!-- 作品集 -->
<div class="portfolio">
    <h2>作品集</h2>
    <div class="p-items">
        <div class="p-item"><span>作品 A</span></div>
        <div class="p-item"><span>作品 B</span></div>
        <div class="p-item"><span>作品 C</span></div>
        <div class="p-item"><span>作品 D</span></div>
    </div>
</div>

<!-- 聯絡方式 -->
<div class="contact">
    <h2>聯絡我</h2>
    <a href="mailto:41143502@gms.ndhu.edu.tw">41143502@gms.ndhu.edu.tw</a>
</div>

<footer>
    © 2025 曲
</footer>

<script>
// jQuery 特效：作品集 Hover 亮光
$(".p-item").hover(
    function(){
        $(this).addClass("p-item-hover");
    },
    function(){
        $(this).removeClass("p-item-hover");
    }
);
</script>

</body>
</html>
