/* 開場動畫 */
#intro {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: #1a1a1d;
display: flex;
align-items: center;
justify-content: center;
flex-direction: column;
z-index: 9999;
animation: fadeOut 2s ease 3s forwards;
}
#intro h1 {
font-size: 3rem;
color: #b3003c;
opacity: 0;
animation: fadeIn 2s ease forwards;
}


@keyframes fadeIn {
to { opacity: 1; }
}
@keyframes fadeOut {
to { opacity: 0; visibility: hidden; }
}


header {
padding: 40px 20px;
text-align: center;
}
.avatar {
width: 160px;
height: 160px;
border-radius: 50%;
border: 4px solid #b3003c;
background-size: cover;
background-position: center;
margin: auto;
}


h2 {
color: #b3003c;
margin-top: 20px;
