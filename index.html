<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人頁面</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: #fff;
            padding: 40px 20px;
            text-align: center;
        }

        nav a {
            color: #fff;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        section {
            padding: 40px 20px;
            max-width: 800px;
            margin: auto;
        }

        h2 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 8px;
        }

        /* 作品集 清單 */
        .work-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .work-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.2s;
        }

        .work-item:hover {
            transform: translateX(5px);
        }

        /* 回頂部按鈕 */
        #topBtn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            padding: 10px 15px;
            background: #222;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            display: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #ddd;
            margin-top: 50px;
        }
    </style>
</head>

<body>
    <!-- HEADER -->
    <header>
        <h1>你的名字</h1>
        <p>一句簡短的自我介紹或標語</p>

        <nav>
            <a href="#about">關於我</a>
            <a href="#works">作品集</a>
            <a href="#contact">聯絡方式</a>
        </nav>
    </header>

    <!-- ABOUT -->
    <section id="about">
        <h2>關於我</h2>
        <p>
            我是一位喜歡創作、設計與寫程式的人。  
            這裡是我的個人頁面，你可以在這裡找到我的作品、興趣與聯絡方式。
        </p>
    </section>

    <!-- WORKS -->
    <section id="works">
        <h2>作品集</h2>

        <div class="work-list">
            <div class="work-item" onclick="showDetail('作品 A')">作品 A - 簡短描述</div>
            <div class="work-item" onclick="showDetail('作品 B')">作品 B - 簡短描述</div>
            <div class="work-item" onclick="showDetail('作品 C')">作品 C - 簡短描述</div>
        </div>
    </section>

    <!-- CONTACT -->
    <section id="contact">
        <h2>聯絡方式</h2>
        <p>Email：example@mail.com</p>
        <p>或在表單輸入訊息：</p>

        <input id="msgInput" type="text" placeholder="輸入訊息…" style="width:100%; padding:10px;">
        <button onclick="sendMsg()" style="margin-top:10px; padding:10px 20px;">送出</button>

        <p id="sendResult" style="margin-top:10px; color:green;"></p>
    </section>

    <!-- Back to top -->
    <div id="topBtn" onclick="scrollToTop()">▲ 回頂部</div>

    <!-- FOOTER -->
    <footer>
        © 2025 你的名字. All Rights Reserved.
    </footer>

    <!-- JS -->
    <script>
        // 點作品後顯示訊息
        function showDetail(name) {
            alert("你點了：" + name);
        }

        // 表單送出訊息
        function sendMsg() {
            const msg = document.getElementById("msgInput").value;
            if (!msg) {
                alert("請輸入訊息！");
                return;
            }
            document.getElementById("sendResult").innerText = "已收到你的訊息：" + msg;
            document.getElementById("msgInput").value = "";
        }

        // 顯示/隱藏回頂部按鈕
        window.onscroll = function() {
            const btn = document.getElementById("topBtn");
            if (document.documentElement.scrollTop > 200) {
                btn.style.display = "block";
            } else {
                btn.style.display = "none";
            }
        }

        // 回頂部功能
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: "smooth" });
        }
    </script>
</body>
</html>
